<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Arcade Portal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #1a1c1e; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: sans-serif;
        }
        #game-wrapper {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: #1a1c1e;
            box-sizing: border-box;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        /* MATHEMATICAL BOUNDING LOCK: Guarantees a clean, uncropped 4:3 view regardless of window dimensions */
        #ruffle-container {
            width: 100%; height: 100%;
            max-width: calc((100vh - 20px) * 4 / 3);
            max-height: calc((100vw - 20px) * 3 / 4);
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            background-color: #000;
        }
        /* Dynamic viewport injection forces strict viewport compliance */
        #ruffle-player, ruffle-player, canvas {
            width: 100% !important; height: 100% !important;
            max-width: 100% !important; max-height: 100% !important;
            display: block !important;
        }
        #mobile-overlay {
            display: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 999; user-select: none; -webkit-user-select: none;
        }
        .dpad { position: absolute; bottom: 25px; left: 25px; display: flex; gap: 15px; pointer-events: auto; }
        .action-btn-group { position: absolute; bottom: 25px; right: 25px; display: flex; gap: 15px; pointer-events: auto; }
        .btn {
            width: 65px; height: 65px; background-color: rgba(255, 255, 255, 0.22);
            border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 50%;
            color: white; font-weight: bold; font-size: 20px;
            display: flex; justify-content: center; align-items: center; touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn:active { background-color: rgba(255, 255, 255, 0.55); }
        .btn-large { width: 85px; border-radius: 30px; font-size: 14px; } 
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <script>
        // Security Gatekeeper
        const familyPassword = "Heaven123"; 
        const accessAttempt = prompt("Please enter the private family access password to play:");
        
        if (accessAttempt !== familyPassword) {
            document.body.innerHTML = "<div style='color:#7a876e; font-family:monospace; font-size:18px; text-align:center; padding-top:40vh;'><h2>ACCESS DENIED.</h2></div>";
            window.stop();
        }
    </script>

    <div id="game-wrapper">
        <div id="ruffle-container">
            <div id="ruffle-player"></div>
        </div>
        
        <div id="mobile-overlay">
            <div class="dpad">
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
            <div class="action-btn-group">
                <div class="btn btn-large" id="btn-space">SPACE</div>
                <div class="btn" id="btn-jump">Z</div>
            </div>
        </div>
    </div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-player");
            container.appendChild(player);
            
            // Hardlocked alignment configuration profile limits spillover completely
            player.config = { 
                autoplay: "on", 
                unmuteOverlay: "hidden", 
                letterbox: "on",
                scale: "showAll", 
                forceScale: true,
                quality: "low",
                wmode: "direct",
                preferWasm: true,
                backgroundExecutionMode: "stop"
            };
            
            player.load("tower_heaven_game.swf");

            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('mobile-overlay').style.display = 'block';

                const mapHardwareKey = (elementId, keyCodeValue, keyString) => {
                    const buttonElement = document.getElementById(elementId);
                    if (!buttonElement) return;

                    buttonElement.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        player.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, cancelable: true, keyCode: keyCodeValue, key: keyString, code: keyString }));
                    });
                    buttonElement.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        player.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true, cancelable: true, keyCode: keyCodeValue, key: keyString, code: keyString }));
                    });
                };

                mapHardwareKey('btn-left', 37, 'ArrowLeft');
                mapHardwareKey('btn-right', 39, 'ArrowRight');
                mapHardwareKey('btn-jump', 90, 'KeyZ'); 
                mapHardwareKey('btn-space', 32, 'Space'); 
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
